name: Publish ArCHi presentations

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'media/**'
      - 'docs/**'
      - 'config/commands.toml'
      - 'tools/build-site-*.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Check command catalog
        run: python3 tools/build-site-catalog.py --check
      - name: Prepare public website
        run: python3 tools/build-site-pages.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
