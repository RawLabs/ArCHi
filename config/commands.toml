# ArCHi's allowlisted operational command registry.
# Machine-specific actions name capabilities; adapters own their implementation.

[[commands]]
id = "open_home"
phrases = ["open home", "open home folder", "open my home folder"]
action = "capability"
capability = "folder.open"
payload = { path = "{home}" }
reply = "Opening home."

[[commands]]
id = "open_downloads"
phrases = ["open downloads", "open downloads folder"]
action = "capability"
capability = "folder.open"
payload = { path = "{home}/Downloads" }
reply = "Opening downloads."

[[commands]]
id = "volume_up"
phrases = ["volume up", "turn volume up", "turn the volume up", "raise the volume", "make it louder", "louder"]
action = "capability"
capability = "audio.volume.raise"
reply = "Volume up."

[[commands]]
id = "volume_down"
phrases = ["volume down", "turn volume down", "turn the volume down", "lower the volume", "make it quieter", "quieter"]
action = "capability"
capability = "audio.volume.lower"
reply = "Volume down."

[[commands]]
id = "zoom_in"
phrases = ["zoom", "zoom in", "zoom in more", "magnify", "magnify the screen", "make the screen bigger", "make everything bigger"]
action = "capability"
capability = "visual.zoom.in"
reply = "Zoomed in."

[[commands]]
id = "zoom_less"
phrases = ["zoom less", "zoom back a little", "reduce zoom", "magnify less"]
action = "capability"
capability = "visual.zoom.out"
reply = "Zoomed out a step."

[[commands]]
id = "zoom_out"
phrases = ["zoom out", "reset zoom", "turn off zoom", "stop zooming", "normal size", "back to normal size"]
action = "capability"
capability = "visual.zoom.reset"
reply = "Zoom reset."

[[commands]]
id = "zoom_restore"
phrases = []
action = "capability"
capability = "visual.zoom.restore"
reply = "Zoom cancelled."

[[commands]]
id = "mute"
phrases = ["mute", "mute audio", "mute volume", "mute sound", "turn volume off", "turn sound off"]
action = "capability"
capability = "audio.mute"
payload = { state = "mute" }
reply = "Audio muted."

[[commands]]
id = "unmute"
phrases = ["unmute", "unmute audio", "unmute volume", "unmute sound", "turn volume on", "turn sound on"]
action = "capability"
capability = "audio.mute"
payload = { state = "unmute" }
reply = "Audio unmuted."

[[commands]]
id = "toggle_mute"
phrases = ["toggle mute", "toggle audio mute", "toggle volume mute"]
action = "capability"
capability = "audio.mute"
payload = { state = "toggle" }
reply = "Audio mute toggled."

[[commands]]
id = "lock_computer"
phrases = ["lock computer", "lock the computer", "lock screen", "lock the screen"]
action = "capability"
capability = "session.lock"
reply = "Locking computer."
reply_before = true

[[commands]]
id = "take_screenshot"
phrases = ["take screenshot", "take a screenshot", "screenshot", "capture screenshot"]
action = "capability"
capability = "screenshot.capture"
reply = "Taking a screenshot."
reply_before = true

[[commands]]
id = "close_active_window"
phrases = ["close this window", "close current window", "close active window", "close the active window", "close window", "dismiss this window"]
action = "capability"
capability = "window.close_active"
reply = "Closing window."

[[commands]]
id = "close_home"
phrases = ["close home", "close home folder", "quit home", "exit home"]
action = "capability"
capability = "folder.close"
payload = { window_classes = ["org.gnome.Nautilus", "org.gnome.NautilusPreviewer"], window_titles = ["Home"], require_title = true }
reply = "Closing home."

[[commands]]
id = "close_downloads"
phrases = ["close downloads", "close downloads folder", "quit downloads", "exit downloads"]
action = "capability"
capability = "folder.close"
payload = { window_classes = ["org.gnome.Nautilus", "org.gnome.NautilusPreviewer"], window_titles = ["Downloads"], require_title = true }
reply = "Closing downloads."

[[commands]]
id = "close_clarify"
phrases = ["close", "quit", "exit", "dismiss"]
action = "clarify"
prompt = "What should I close: home, downloads, or this window? For an app, say close followed by its name."
targets = { home = "close_home", downloads = "close_downloads", window = "close_active_window" }

[[commands]]
id = "read_clipboard"
phrases = ["read clipboard", "read clipboard aloud", "read this aloud", "speak clipboard", "read that aloud"]
action = "launch"
argv = ["{archi_bin}/pocket-tts-read-clipboard"]
reply = ""

[[commands]]
id = "stop_speaking"
phrases = ["stop speaking", "stop talking", "shut up", "silence", "cancel speech"]
action = "run"
argv = ["{archi_bin}/archi-stop-speaking"]
reply = ""

[[commands]]
id = "off_record"
phrases = ["off record", "off the record", "private mode"]
action = "mode_off_record"
reply = "Logging off."

[[commands]]
id = "logging_on"
phrases = ["logging on", "back on record", "back on the record", "resume logging"]
action = "mode_logging_on"
reply = "Logging on."

[[commands]]
id = "next_workspace"
phrases = ["next workspace", "switch to next workspace"]
action = "capability"
capability = "workspace.next"
reply = "Next workspace."

[[commands]]
id = "previous_workspace"
phrases = ["previous workspace", "last workspace", "switch to previous workspace"]
action = "capability"
capability = "workspace.previous"
reply = "Previous workspace."

[[commands]]
id = "identity"
phrases = ["what are you", "who are you", "identify yourself"]
action = "reply"
reply = "I'm ArCHi."

[[commands]]
id = "help"
phrases = ["help", "what can you do"]
action = "reply"
reply = "I can open and close installed apps and folders, control zoom, volume and mute state, take screenshots, manage windows, read the clipboard, lock the computer, switch workspaces, and control logging."

[[commands]]
id = "list_commands"
phrases = ["list commands", "show commands", "what commands do you know", "command list"]
action = "reply"
reply = "Say open or close followed by an installed app name. System commands include home, downloads, zoom, volume, mute, screenshots, locking, windows, clipboard reading, workspaces, and logging."
