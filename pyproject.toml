[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archi-assist"
version = "0.1.0b1"
description = "A local, deterministic accessibility control plane for Linux"
requires-python = ">=3.11"
authors = [{ name = "ArCHi contributors" }]
readme = "README.md"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Wayland",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
intent = ["hassil>=3,<4"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
